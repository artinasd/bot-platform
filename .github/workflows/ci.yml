name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bot_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bot_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bot_platform?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/bot_platform?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply schema to clean PostgreSQL
        run: npx prisma db push --skip-generate

      - name: Verify tenant-consistent foreign keys in PostgreSQL
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d bot_platform -v ON_ERROR_STOP=1 -f scripts/verify-tenant-constraints.sql

      - name: Generate initial migration baseline for review
        run: |
          mkdir -p /tmp/prisma-baseline/prisma/migrations/20261014000000_baseline
          npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > /tmp/prisma-baseline/prisma/migrations/20261014000000_baseline/migration.sql
          printf 'provider = "postgresql"\n' > /tmp/prisma-baseline/prisma/migrations/migration_lock.toml

      - name: Upload generated migration baseline
        uses: actions/upload-artifact@v4
        with:
          name: prisma-migration-baseline-preview
          path: /tmp/prisma-baseline/prisma/migrations/
          if-no-files-found: error
          retention-days: 7

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build
